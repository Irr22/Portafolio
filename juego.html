<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego | irr 222</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: #0f0f0f; color: #fff; }

    #loader {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #aaa;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(0,255,204,0.15);
      border-top-color: #00ffcc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #contenido-juego {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 120px 20px 80px;
    }

    .juego-hero img {
      width: 100%;
      border-radius: 24px;
      margin-bottom: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .juego-titulo {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      margin-bottom: 8px;
    }

    .juego-seccion {
      margin-top: 40px;
    }

    .juego-seccion h2 {
      color: #00ffcc;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .juego-seccion p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #ccc;
      white-space: pre-line;
    }

    .btn-play {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding: 14px 28px;
      background: #00ffcc;
      color: #000;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0,255,204,0.3);
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 40px;
    }
    .tab-btn {
      padding: 8px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #aaa;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.activo {
      background: #00ffcc;
      color: #000;
      border-color: #00ffcc;
    }

    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .galeria-item img {
      width: 100%;
      border-radius: 12px;
    }
    .galeria-item p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 32px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #00ffcc; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-content">
      <a href="index.html" class="logo-wrapper" style="text-decoration:none;display:flex;align-items:center;gap:12px;">
        <img src="./assets/logo.gif" alt="irr 222" style="height:45px;border-radius:50%;">
        <span style="color:#fff;font-size:1.5rem;font-weight:900;">irr 222</span>
      </a>
      <div class="nav-links">
        <a href="index.html#bio">BIO</a>
        <a href="index.html#proyectos">JUEGOS</a>
        <a href="index.html#actividad">ACTIVIDAD</a>
      </div>
    </div>
  </nav>

  <div id="loader">
    <div class="spinner"></div>
    <span>Cargando proyecto…</span>
  </div>

  <div id="contenido-juego"></div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const juegoId = params.get('id');
    const modoParam = params.get('view') || 'info'; // 'info' | 'dev'

    let modoActual = modoParam;
    let juegoActual = null;

    async function cargarDetalle() {
      if (!juegoId) {
        mostrarError("No se especificó ningún juego.");
        return;
      }

      try {
        const res = await fetch('./datos.json');
        if (!res.ok) throw new Error("datos.json no accesible");
        const data = await res.json();

        // Busca por id_proyecto (campo unificado en datos.json)
        const juego = data.proyectos.find(p => p.id_proyecto === juegoId);

        if (!juego) {
          mostrarError(`Proyecto "${juegoId}" no encontrado.`);
          return;
        }

        juegoActual = juego;
        document.title = `${juego.titulo} | irr 222`;
        renderizarJuego(juego);

      } catch (err) {
        console.error(err);
        mostrarError("Error al cargar datos.json: " + err.message);
      }
    }

    function mostrarError(msg) {
      document.getElementById('loader').innerHTML = `
        <h2 style="color:#f66;">Error</h2>
        <p style="color:#aaa;">${msg}</p>
        <a href="index.html" style="color:#00ffcc;margin-top:16px;">← Volver al inicio</a>`;
    }

    function renderizarJuego(j) {
      const tieneTecnico = !!j.info_tecnica;

      const tabs = tieneTecnico ? `
        <div class="tab-bar">
          <button class="tab-btn ${modoActual === 'info' ? 'activo' : ''}"
                  onclick="cambiarModo('info')">Descripción</button>
          <button class="tab-btn ${modoActual === 'dev' ? 'activo' : ''}"
                  onclick="cambiarModo('dev')">Ficha técnica</button>
        </div>` : '';

      const galeria = (j.imagenes_galeria && j.imagenes_galeria.length)
        ? `<div class="juego-seccion">
             <h2>Galería</h2>
             <div class="galeria-grid">
               ${j.imagenes_galeria.map((url, i) => `
                 <div class="galeria-item">
                   <img src="${url}" alt="${j.textos_galeria?.[i] || ''}">
                   ${j.textos_galeria?.[i] ? `<p>${j.textos_galeria[i]}</p>` : ''}
                 </div>`).join('')}
             </div>
           </div>` : '';

      document.getElementById('contenido-juego').innerHTML = `
        <a href="index.html" class="back-link">← Volver</a>
        <div class="juego-hero">
          <h1 class="juego-titulo">${j.titulo}</h1>
          <img src="${j.imagen}" alt="${j.titulo}">
        </div>
        ${tabs}
        <div id="texto-principal" class="juego-seccion">
          <h2 id="label-seccion">${modoActual === 'dev' ? 'Ficha técnica' : 'Descripción'}</h2>
          <p id="texto-contenido">${modoActual === 'dev' ? j.info_tecnica : j.info_publica}</p>
        </div>
        <a href="${j.link_juego}" target="_blank" rel="noopener" class="btn-play">
          ▶ Ver en Google Play
        </a>
        ${galeria}`;

      document.getElementById('loader').style.display = 'none';
      document.getElementById('contenido-juego').style.display = 'block';
    }

    window.cambiarModo = function(modo) {
      if (!juegoActual) return;
      modoActual = modo;

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
      event.currentTarget.classList.add('activo');

      document.getElementById('label-seccion').textContent =
        modo === 'dev' ? 'Ficha técnica' : 'Descripción';
      document.getElementById('texto-contenido').textContent =
        modo === 'dev' ? juegoActual.info_tecnica : juegoActual.info_publica;
    };

    cargarDetalle();
  </script>
</body>
</html>
